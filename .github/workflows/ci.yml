name: Beat Echo verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native and WebAssembly tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld
      - name: Host tests with ASan and UBSan
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBE_SANITIZERS=ON
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: Static board guards
        run: python3 scripts/check_board.py
      - name: Rebuild browser and run shared-core regression
        env:
          CLANGXX: /usr/bin/clang++
        run: |
          python3 scripts/build_web.py
          node --check web/app.js
          node tests/test_wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: beat-echo-browser
          path: web/index.html
          if-no-files-found: error
  flash-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated flashing dependencies
        run: python -m pip install -r requirements-flash.txt
      - name: Offline safety tests (no board attached)
        run: python -m unittest discover -s tests -p test_flash_tools.py -v
      - name: Verify tool entry points without opening a port
        run: |
          python scripts/be.py doctor
          python -m esptool version
          python -m esptool write_flash --help
          python -m esptool verify_flash --help
      - name: Check PowerShell wrapper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/flash.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
  esp-idf-build:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 target (no hardware attached)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          python scripts/be.py build
      - name: Package, validate and rehearse without opening serial
        run: |
          . /opt/esp/idf/export.sh
          python scripts/be.py package
          python scripts/be.py verify-package
          python scripts/be.py flash --port DRY_RUN_ONLY --dry-run
          python -m esptool --chip esp32s3 image_info dist/beat-echo-esp32s3/beat_echo.bin
      - uses: actions/upload-artifact@v4
        with:
          name: beat-echo-flash-bundle
          path: dist/beat-echo-esp32s3/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: beat-echo-release-assets
          path: |
            dist/beat-echo-esp32s3.zip
            dist/beat-echo-esp32s3.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: beat-echo-debug-symbols
          path: |
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/flasher_args.json
            firmware/build/project_description.json
            firmware/build/config/sdkconfig.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [core-and-web, flash-tools, esp-idf-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beat-echo-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: beat-echo-browser
          path: browser
      - name: Publish explicitly tagged experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* browser/index.html \
            --verify-tag --prerelease --title "Beat Echo $TAG" \
            --notes "Experimental EasyInput V2.0 firmware. Target build and automated tests passed; physical hardware is NOT verified. Read docs/FLASHING.md before use. Download beat-echo-esp32s3.zip, not GitHub's Source code archive."
