name: Beat Echo verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  esp-idf-build:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 (no hardware attached)
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware build
      - uses: actions/upload-artifact@v4
        with:
          name: beat-echo-esp32s3-build
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json
            firmware/build/config/sdkconfig.json
